AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC federation for deploying AWS CloudFormation templates
  Creates (optionally) the GitHub OIDC identity provider, a role GitHub Actions
  assumes via short-lived federated credentials (no long-lived AWS keys stored in
  GitHub), and a separate, narrowly-scoped CloudFormation execution role that the
  CloudFormation service itself assumes to actually create/update resources. This
  two-role split means leaked GitHub Actions credentials can only call
  CloudFormation APIs and pass exactly one specific role - never call ssm:* (or
  any other service) directly.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organisation or username that owns the repository (case-sensitive).
    AllowedPattern: '.+'

  GitHubRepo:
    Type: String
    Description: Repository name only, without the org/ prefix (case-sensitive).
    AllowedPattern: '.+'

  CreateOidcProvider:
    Type: String
    Description: >
      Set to false if a token.actions.githubusercontent.com OIDC provider already
      exists in this AWS account (an account can only have one - creating a second
      fails with an "already exists" error).
    Default: 'true'
    AllowedValues: ['true', 'false']

  ExistingOidcProviderArn:
    Type: String
    Description: >
      Only used when CreateOidcProvider is false. ARN of the existing
      token.actions.githubusercontent.com provider, e.g.
      arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com
    Default: ''

  GitHubPlanEnvironmentName:
    Type: String
    Description: >
      Name of the GitHub Environment used by the read-only "plan" job (runs on
      pull_request, creates/describes a change set, never executes it).
    Default: aws-plan

  GitHubDeployEnvironmentName:
    Type: String
    Description: >
      Name of the protected GitHub Environment used by the "deploy" job (should have
      required reviewers configured and be restricted to the main branch).
    Default: aws-production

  StackNamePattern:
    Type: String
    Description: >
      Wildcard pattern (no leading '/') restricting which CloudFormation stacks the
      deploy role may operate on. Keep this as narrow as possible.
    Default: ProjectA-*

  SsmParameterPrefix:
    Type: String
    Description: >
      Wildcard prefix (no leading '/') restricting which SSM parameters the
      CloudFormation execution role may write. Must cover every parameter Name
      defined in deploy/cloudformation/parameters.yaml.
    Default: Primary-*

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates the token against its own trusted CA store for this well-known
      # issuer, but the property is required by the resource type; this is GitHub's
      # documented root CA thumbprint.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # Assumed directly by GitHub Actions via OIDC (sts:AssumeRoleWithWebIdentity).
  # Deliberately holds NO permissions on SSM, S3, etc. - only enough CloudFormation
  # access to drive a deploy of one specific stack, plus permission to pass (not
  # assume) the execution role below to the CloudFormation service.
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub gha-${GitHubRepo}-cfn-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # Both keys must live under a single StringEquals map - YAML does not
              # support two sibling keys with the same name, so a second StringEquals:
              # block here would silently replace the first rather than adding to it.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Restricting sub to specific GitHub Environments (rather than a branch
                # ref) means only workflow runs that passed that Environment's own
                # protection rules (e.g. required reviewers on aws-production) can ever
                # obtain credentials - not just any push to main.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubPlanEnvironmentName}
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubDeployEnvironmentName}
      Policies:
        - PolicyName: cloudformation-deploy-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStackLifecycle
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePattern}/*
              - Sid: CloudFormationValidateTemplateIsUnscoped
                Effect: Allow
                # ValidateTemplate has no resource-level permissions in IAM - it must be "*".
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassExecutionRoleToCloudFormationOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # Assumed only by the CloudFormation service (never by GitHub Actions directly)
  #Passed to `aws cloudformation deploy` via --role-arn.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-cfn-execution
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ssm-parameters-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSharedSsmParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - ssm:ListTagsForResource
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SsmParameterPrefix}

        # --- IAM: the instance role itself ---
        - PolicyName: iam-instance-role-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageInstanceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/*-instance-role
              - Sid: AttachOnlyTheExpectedManagedPolicies
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/*-instance-role
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                      - arn:aws:iam::aws:policy/AmazonSSMFullAccess

        # --- IAM: the instance profile ---
        - PolicyName: iam-instance-profile-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageInstanceProfile
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:TagInstanceProfile
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/*-instance-profile

        # --- IAM: PassRole, so EC2 can attach the instance role via the profile at launch ---
        - PolicyName: iam-passrole-to-ec2-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PassInstanceRoleToEc2Only
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/*-instance-role
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

        # --- EC2: the three security groups ---
        - PolicyName: ec2-security-groups-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSecurityGroups
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
              - Sid: TagSecurityGroupsOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSecurityGroup
              - Sid: DescribeSecurityGroupsIsUnscoped
                Effect: Allow
                # EC2 Describe* actions don't support resource-level permissions - must be '*'.
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeTags
                Resource: '*'

        # --- EC2: the instance itself (launch + in-place attribute updates only) ---
        - PolicyName: ec2-instance-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LaunchInstance
                Effect: Allow
                # RunInstances checks permissions against every sub-resource type it touches, not
                # just the instance itself - each is scoped to this account/region where possible.
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:key-pair/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              - Sid: ModifyExistingInstanceAttributes
                Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - Sid: TagInstanceAndVolumesOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Sid: RequiredUnscopedReads
                Effect: Allow
                # None of these support resource-level permissions - must be '*'.
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                Resource: '*'

        # --- EC2: the Elastic IP ---
        - PolicyName: ec2-elastic-ip-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssociateAddressToInstance
                Effect: Allow
                Action: ec2:AssociateAddress
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
              - Sid: TagElasticIpOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: AllocateAddress
              - Sid: RequiredUnscopedAllocateAndDescribe
                Effect: Allow
                # AllocateAddress and DescribeAddresses don't support resource-level permissions.
                Action:
                  - ec2:AllocateAddress
                  - ec2:DescribeAddresses
                Resource: '*'

        # --- EC2: the EFS mount-target security group ---
        - PolicyName: ec2-efs-security-group-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageEfsSecurityGroup
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
              - Sid: TagSecurityGroupOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSecurityGroup
              - Sid: DescribeSecurityGroupsIsUnscoped
                Effect: Allow
                # EC2 Describe* actions don't support resource-level permissions - must be '*'.
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeTags
                Resource: '*'

        # --- EC2: network interfaces EFS creates behind the scenes for each mount target ---
        - PolicyName: ec2-efs-mount-target-networking-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateEniForMountTargets
                Effect: Allow
                # elasticfilesystem:CreateMountTarget has EFS orchestrate an ENI creation using the
                # caller's own credentials - this is the underlying EC2-side permission that requires.
                Action: ec2:CreateNetworkInterface
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - Sid: TagEniOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateNetworkInterface
              - Sid: RequiredUnscopedReads
                Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                Resource: '*'

        # --- EFS: the file system itself ---
        - PolicyName: efs-file-system-unscoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageFileSystem
                Effect: Allow
                # No elasticfilesystem action supports resource-level permissions per AWS's Service
                # Authorization Reference - '*' is the tightest this service's IAM model allows.
                Action:
                  - elasticfilesystem:CreateFileSystem
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:UpdateFileSystem
                  - elasticfilesystem:PutBackupPolicy
                  - elasticfilesystem:DescribeBackupPolicy
                  - elasticfilesystem:DescribeTags
                  - elasticfilesystem:ListTagsForResource
                Resource: '*'
              - Sid: TagFileSystemOnCreateOnly
                Effect: Allow
                Action: elasticfilesystem:TagResource
                Resource: '*'
                Condition:
                  StringEquals:
                    elasticfilesystem:CreateAction: CreateFileSystem

        # --- EFS: mount targets (one per private subnet) ---
        - PolicyName: efs-mount-targets-unscoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMountTargets
                Effect: Allow
                Action:
                  - elasticfilesystem:CreateMountTarget
                  - elasticfilesystem:DescribeMountTargets
                  - elasticfilesystem:DescribeMountTargetSecurityGroups
                  - elasticfilesystem:ModifyMountTargetSecurityGroups
                Resource: '*'

        # --- EFS: the access point ---
        - PolicyName: efs-access-point-unscoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageAccessPoint
                Effect: Allow
                Action:
                  - elasticfilesystem:CreateAccessPoint
                  - elasticfilesystem:DescribeAccessPoints
                Resource: '*'
              - Sid: TagAccessPointOnCreateOnly
                Effect: Allow
                Action: elasticfilesystem:TagResource
                Resource: '*'
                Condition:
                  StringEquals:
                    elasticfilesystem:CreateAction: CreateAccessPoint

  GitHubActionsAnsibleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gha-projecta-ansible
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:${GitHubOrg}/${GitHubRepo}:environment:aws-ansible
      Policies:
        - PolicyName: ssm-session-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartSessionToTaggedInstanceOnly
                Effect: Allow
                Action: ssm:StartSession
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: projects-darrentuer-net
              - Sid: RequiredUnscopedReads
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ssm:DescribeSessions
                  - ssm:DescribeInstanceInformation
                  - ssm:GetConnectionStatus
                  - ssm:StartSession
                Resource: '*'
              - Sid: EndOwnSessionsOnly
                Effect: Allow
                Action:
                  - ssm:TerminateSession
                  - ssm:ResumeSession
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:session/*

Outputs:
  GitHubActionsDeployRoleArn:
    Description: >
      Set this as the AWS_DEPLOY_ROLE_ARN repository/environment variable used by
      .github/workflows/deploy-cloudformation-parameters.yml.
    Value: !GetAtt GitHubActionsDeployRole.Arn

  CfnExecutionRoleArn:
    Description: >
      Set this as the AWS_CFN_EXECUTION_ROLE_ARN repository/environment variable
      used by .github/workflows/deploy-cloudformation-parameters.yml.
    Value: !GetAtt CfnExecutionRole.Arn

  GitHubActionsAnsibleRoleArn:
    Description: >
      Set this as the AWS_ANSIBLE_ROLE_ARN repository/environment variable used by
      .github/workflows/deploy-web-projecta.yml.
    Value: !GetAtt GitHubActionsAnsibleRole.Arn
