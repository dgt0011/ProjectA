---

- name: Update all installed packages using APT module
  apt:
    name: '*'
    state: latest
    update_cache: yes

- name: "Install nginx"
  apt:
    name:
      - nginx
    state: latest

- name: Create the web directory to hold the website
  file:
    path: /mnt/data/web
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0751"

- name: Copy the virtual host file for the map
  copy:
    dest: /etc/nginx/sites-enabled/map
    src: virtual_host_map
    owner: root
    group: root
    mode: "0444"