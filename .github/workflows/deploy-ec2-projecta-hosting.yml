name: 3. Deploy EC2

# Deploys deploy/cloudformation/EC2_projecta_hosting.yaml to AWS.
#

on:
  push:
    branches: [main]
    paths:
      - deploy/cloudformation/EC2_projecta_hosting.yaml
      - .github/workflows/deploy-ec2-projecta-hosting.yml
  pull_request:
    branches: [main]
    paths:
      - deploy/cloudformation/EC2_projecta_hosting.yaml
      - .github/workflows/deploy-ec2-projecta-hosting.yml
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name to deploy to
        required: false
        default: ProjectA-EC2-Host

# Least-privilege default for the GITHUB_TOKEN: this workflow only needs to read
# the repo and mint an OIDC token, nothing else (no issues/PR/packages access).
permissions:
  contents: read
  id-token: write

# Never run two deploys of the same stack concurrently, and never cancel a deploy
# that's already in flight (an interrupted CloudFormation update can leave the
# stack in UPDATE_ROLLBACK_FAILED, requiring manual intervention to recover).
concurrency:
  group: deploy-projecta-ec2-hosting
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TEMPLATE_FILE: deploy/cloudformation/EC2_projecta_hosting.yaml
  DEFAULT_STACK_NAME: ProjectA-EC2-Host

jobs:
  # Runs for every PR that touches the template. Purely read-only: creates a
  # CloudFormation change set, prints what it would do, then deletes the change
  # set without ever executing it. Safe to run against untrusted PR branches
  # because it cannot mutate any AWS resource.
  plan:
    name: Plan (preview change set)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: aws-plan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_FILE}"

      - name: Create change set
        id: changeset
        run: |
          STACK_NAME="${DEFAULT_STACK_NAME}"
          CHANGE_SET_NAME="pr-${{ github.event.pull_request.number }}-${{ github.run_id }}"

          # Written to GITHUB_OUTPUT before create-change-set runs (not after) so the
          # name is known - and the change set can still be cleaned up below - even
          # if the call itself exits non-zero (e.g. AWS creates the change set but it
          # ends up in a FAILED state).
          echo "stack_name=$STACK_NAME" >> "$GITHUB_OUTPUT"
          echo "change_set_name=$CHANGE_SET_NAME" >> "$GITHUB_OUTPUT"

          # `aws cloudformation deploy` (used by the real "deploy" job below) has no
          # --change-set-name option at all - it only ever creates an internally-named
          # change set, which is fine when you let it execute immediately, but leaves
          # nothing stable to describe/delete afterwards for a preview-only run. Using
          # the lower-level create-change-set API instead gives full control over the
          # name, at the cost of having to determine CREATE vs. UPDATE ourselves (unlike
          # `deploy`, which infers this automatically from whether the stack exists).
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          if [ "$STACK_STATUS" = "DOES_NOT_EXIST" ] || [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            CHANGE_SET_TYPE=CREATE
          else
            CHANGE_SET_TYPE=UPDATE
          fi

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --template-body "file://${TEMPLATE_FILE}" \
            --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --capabilities CAPABILITY_NAMED_IAM

          # Change set creation is asynchronous - wait for it to finish computing.
          # Deliberately not failing the job here: "no changes to preview" is a normal,
          # expected outcome (e.g. a PR that only touches comments/formatting), not an
          # error, and is reported as such by the next step instead.
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" || true

      - name: Describe change set
        if: always() && steps.changeset.outputs.change_set_name
        run: |
          STATUS_REASON=$(aws cloudformation describe-change-set \
            --stack-name "${{ steps.changeset.outputs.stack_name }}" \
            --change-set-name "${{ steps.changeset.outputs.change_set_name }}" \
            --query 'StatusReason' \
            --output text)

          {
            echo "## CloudFormation change set preview"
            case "$STATUS_REASON" in
              *"didn't contain changes"*|*"No updates"*)
                echo "No changes detected."
                ;;
              *)
                echo '```'
                aws cloudformation describe-change-set \
                  --stack-name "${{ steps.changeset.outputs.stack_name }}" \
                  --change-set-name "${{ steps.changeset.outputs.change_set_name }}" \
                  --query 'Changes[].ResourceChange.{Action:Action,Resource:LogicalResourceId,Type:ResourceType,Replacement:Replacement}' \
                  --output table
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # Change sets that are never executed still count towards account limits and
      # clutter the console, so always tidy up - even if a prior step failed.
      - name: Delete change set
        if: always() && steps.changeset.outputs.change_set_name
        run: |
          aws cloudformation delete-change-set \
            --stack-name "${{ steps.changeset.outputs.stack_name }}" \
            --change-set-name "${{ steps.changeset.outputs.change_set_name }}" || true

  # Runs on pushes to main (or a manual dispatch) and actually applies the change.
  # Gated behind the aws-production Environment
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: aws-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve stack name
        id: vars
        run: |
          echo "stack_name=${{ github.event.inputs.stack_name || env.DEFAULT_STACK_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_FILE}"

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "${{ steps.vars.outputs.stack_name }}" \
            --template-file "$TEMPLATE_FILE" \
            --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}" \
            --no-fail-on-empty-changeset \
            --tags Project=ProjectA Application=ProjectA ManagedBy=github-actions \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ProjectTag=ProjectA ApplicationTag=ProjectA InstanceType=t3.micro

      - name: Show final stack status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${{ steps.vars.outputs.stack_name }}" \
            --query 'Stacks[0].{Status:StackStatus,LastUpdated:LastUpdatedTime}' \
            --output table
